name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive package version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # ---- 验证段：与 ci.yml 逐字同命令，测试全绿才允许进入发布段 ----
      - name: Restore
        run: dotnet restore

      - name: Build (zero warnings tolerated)
        run: dotnet build --no-restore -warnaserror

      - name: Test + coverage gate (line & branch >= 98%, vector conformance)
        run: >
          dotnet test --no-build
          /p:CollectCoverage=true
          /p:Threshold=98
          /p:ThresholdType=both
          /p:CoverletOutputFormat=opencover

      # ---- 发布段：pack 自动完成 Release 构建（TreatWarningsAsErrors 同样生效），包版本取自 tag ----
      - name: Pack (Release, version = tag)
        run: dotnet pack src/Wop.Sdk/Wop.Sdk.csproj -c Release -o dist /p:Version="$VERSION"

      - name: Push to NuGet
        run: >
          dotnet nuget push dist/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_TOKEN }}
