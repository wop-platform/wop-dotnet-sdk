name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify (build + tests + coverage gate)
        uses: ./.github/actions/verify

      - name: Derive package version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 发布段：pack 自动完成 Release 构建，包版本取自 tag
      - name: Pack (Release, version = tag)
        run: dotnet pack src/Wop.Sdk/Wop.Sdk.csproj -c Release -o dist /p:Version="$VERSION"

      - name: Push to NuGet.org
        if: env.NUGET_TOKEN != ''
        run: >
          dotnet nuget push dist/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_TOKEN" --skip-duplicate

      - name: Upload package artifact (NUGET_TOKEN 未配置时的手动发布通道)
        if: env.NUGET_TOKEN == ''
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: dist/*.nupkg
