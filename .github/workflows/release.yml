name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # GitHub Release 创建（gh release create）
      id-token: write   # Trusted Publishing：GitHub OIDC 令牌签发（nuget.org 换取 1h 临时 API key）
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify (build + tests + coverage gate)
        uses: ./.github/actions/verify

      - name: Derive package version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 发布段：pack 自动完成 Release 构建，包版本取自 tag
      - name: Pack (Release, version = tag)
        run: dotnet pack src/Wop.Sdk/Wop.Sdk.csproj -c Release -o dist /p:Version="$VERSION"

      # Trusted Publishing（nuget.org 策略 #322180684：wop-platform/wop-dotnet-sdk + release.yml）：
      # OIDC 令牌 → nuget.org 换取临时 API key（1h 有效，一令牌一密钥），无长期凭据
      - name: NuGet login (OIDC → temp API key)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: dreambt   # nuget.org profile 名（包 owner），非邮箱

      - name: Push to NuGet.org
        run: >
          dotnet nuget push dist/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub Release (nupkg 资产)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.nupkg \
            --title "Wop.Sdk ${GITHUB_REF_NAME#v}" \
            --generate-from-tag

      - name: Upload package artifact (发布排障通道)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: dist/*.nupkg
