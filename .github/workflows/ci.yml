name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (zero warnings tolerated)
        run: dotnet build --no-restore -warnaserror

      # coverlet.msbuild 的插桩在 build 阶段注入：禁止 --no-build（会采不到数据）；
      # ThresholdType 只认 line/branch/method（逗号分隔），"both" 是非法值会被静默忽略
      - name: Test + coverage gate (line & branch >= 98%, vector conformance)
        run: >
          dotnet test --no-restore
          /p:CollectCoverage=true
          /p:Threshold=98
          '/p:ThresholdType="line,branch"'
          /p:CoverletOutputFormat=opencover

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: dotnet pack src/Wop.Sdk -c Release -o dist

      - name: Publish to NuGet.org
        if: ${{ secrets.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "dist/Wop.Sdk.*.nupkg" -k "$NUGET_API_KEY"
          -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package artifact (NUGET_API_KEY 未配置时的手动发布通道)
        if: ${{ secrets.NUGET_API_KEY == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: dist/*.nupkg
