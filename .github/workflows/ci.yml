name: ci

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN 最小权限（actions/missing-workflow-permissions）：
# 本流水线仅读代码，无 GitHub 侧写操作
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify (build + tests + coverage gate)
        uses: ./.github/actions/verify
