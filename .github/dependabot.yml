version: 2

updates:
  # 运行时密码依赖（BouncyCastle.Cryptography）——安全敏感，发布后必须有更新提醒
  - package-ecosystem: nuget
    directory: /src/Wop.Sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # CI/发版工作流自身依赖（actions/checkout、setup-dotnet 等）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
